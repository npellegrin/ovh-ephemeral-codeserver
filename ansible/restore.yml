---
- name: Restore data from OVH Object Storage
  hosts: dev_servers
  become: true
  vars_files:
    - group_vars/vars.yml
    - group_vars/vault.yml

  vars:
    # rclone reads a whole remote definition from the environment, so the Swift
    # credentials never land in a config file on the instance. Applied only to
    # the tasks that talk to Object Storage.
    rclone_env:
      RCLONE_CONFIG_OVH_TYPE: swift
      RCLONE_CONFIG_OVH_ENV_AUTH: "false"
      RCLONE_CONFIG_OVH_AUTH_VERSION: "3"
      RCLONE_CONFIG_OVH_AUTH: "{{ swift_auth }}"
      RCLONE_CONFIG_OVH_USER: "{{ swift_user }}"
      RCLONE_CONFIG_OVH_KEY: "{{ swift_key }}"
      RCLONE_CONFIG_OVH_TENANT_ID: "{{ swift_tenant_id }}"
      RCLONE_CONFIG_OVH_DOMAIN: default
      RCLONE_CONFIG_OVH_TENANT_DOMAIN: default
      RCLONE_CONFIG_OVH_REGION: "{{ swift_region }}"
      RCLONE_CONFIG_OVH_ENDPOINT_TYPE: public

  tasks:
    - name: Install rclone
      ansible.builtin.apt:
        name: rclone
        state: present

    - name: Create a temp file for the downloaded archive
      ansible.builtin.tempfile:
        state: file
        suffix: .tar.gz
      register: restore_archive

    # The always block removes the archive whether or not the restore succeeded.
    - name: Run the restore
      block:
        # rc=3 / "directory not found" means the container has no backups yet
        # (first run); anything else is a real error.
        - name: List the backups
          ansible.builtin.command: rclone lsf ovh:{{ backup_bucket }}/ --files-only
          environment: "{{ rclone_env }}"
          register: backup_list
          changed_when: false
          failed_when:
            - backup_list.rc != 0
            - "'directory not found' not in backup_list.stderr"

        - name: Select the latest backup
          ansible.builtin.set_fact:
            latest_backup: >-
              {{ (backup_list.stdout_lines | default([])
                  | select('match', 'backup-.*\.tar\.gz$')
                  | sort | list)[-1] | default('') }}

        - name: Skip restore when there is no backup
          ansible.builtin.debug:
            msg: "No backup found in {{ backup_bucket }}, nothing to restore."
          when: latest_backup | length == 0

        - name: Restore from the latest backup
          when: latest_backup | length > 0
          block:
            - name: Download the latest backup
              ansible.builtin.command: rclone copyto ovh:{{ backup_bucket }}/{{ latest_backup }} {{ restore_archive.path }}
              environment: "{{ rclone_env }}"
              changed_when: true

            - name: Deploy the safe extraction script
              ansible.builtin.template:
                src: safe_restore.sh.j2
                dest: /root/.safe_restore.sh
                mode: '0700'

            - name: Validate the archive and restore only allow-listed paths
              ansible.builtin.command: /bin/bash /root/.safe_restore.sh
              register: safe_restore
              changed_when: "'restored' in safe_restore.stdout"

            - name: Remove the extraction script
              ansible.builtin.file:
                path: /root/.safe_restore.sh
                state: absent

            - name: Fix permissions after restoration
              ansible.builtin.file:
                path: "/home/{{ code_server_user }}"
                owner: "{{ code_server_user }}"
                group: "{{ code_server_user }}"
                recurse: true

            - name: Confirm the restoration
              ansible.builtin.debug:
                msg: "Restoration completed from {{ latest_backup }}"
      always:
        - name: Remove the downloaded archive
          ansible.builtin.file:
            path: "{{ restore_archive.path }}"
            state: absent
