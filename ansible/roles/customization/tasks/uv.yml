---
# uv (Python package/project manager) from the pinned, checksummed release
# tarball (no curl | sh). `uv python install` then fetches standalone CPython
# builds into ~/.local/share/uv/python, which is in backup_excludes: large,
# reinstallable, and re-created by this file on every provision.
# https://docs.astral.sh/uv/concepts/python-versions/
- name: Create a temp file for the uv tarball
  ansible.builtin.tempfile:
    state: file
    suffix: .tar.gz
  register: customization_uv_tarball

- name: Download the pinned uv release
  ansible.builtin.get_url:
    url: "https://github.com/astral-sh/uv/releases/download/{{ customization_uv_version }}/uv-x86_64-unknown-linux-gnu.tar.gz"
    dest: "{{ customization_uv_tarball.path }}"
    checksum: "sha256:{{ customization_uv_sha256 }}"
    mode: '0600'

- name: Install uv and uvx into /usr/local/bin
  ansible.builtin.unarchive:
    src: "{{ customization_uv_tarball.path }}"
    dest: /usr/local/bin
    remote_src: true
    owner: root
    group: root
    mode: '0755'
    extra_opts:
      - --strip-components=1
      - --wildcards
      - "*/uv"
      - "*/uvx"

- name: Remove the downloaded tarball
  ansible.builtin.file:
    path: "{{ customization_uv_tarball.path }}"
    state: absent

# uv is a no-op when the version is already present, so this stays idempotent.
- name: Install the managed CPython versions
  ansible.builtin.command: "uv python install {{ item }}"
  become: true
  become_user: "{{ code_server_user }}"
  environment:
    UV_PYTHON_INSTALL_DIR: "/home/{{ code_server_user }}/.local/share/uv/python"
  loop: "{{ customization_uv_python_versions }}"
  register: customization_uv_python_install
  changed_when: "'Installed' in customization_uv_python_install.stderr"

# Shared marker with ansible_core.yml, see the note there.
- name: Put ~/.local/bin on PATH for interactive shells
  ansible.builtin.blockinfile:
    path: "/home/{{ code_server_user }}/.bashrc"
    create: true
    owner: "{{ code_server_user }}"
    group: "{{ code_server_user }}"
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED - local bin"
    block: |
      export PATH="$HOME/.local/bin:$PATH"
