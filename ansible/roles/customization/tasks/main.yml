---
# Dispatcher for the optional dev tooling.

# Most tools below install into the dev user's home with become_user, and that
# needs setfacl to hand Ansible's temp files over. Debian's cloud image has no
# acl package so installing it.
- name: Install acl, required by the become_user tasks in this role
  ansible.builtin.apt:
    name: acl
    state: present

- name: Set up the Terraform plugin cache
  ansible.builtin.include_tasks: terraform_plugin_cache.yml
  when: customization_terraform_plugin_cache | bool

- name: Install tfenv
  ansible.builtin.include_tasks: tfenv.yml
  when: customization_tfenv | bool

- name: Install uv and its managed Python versions
  ansible.builtin.include_tasks: uv.yml
  when: customization_uv | bool

- name: Install nvm
  ansible.builtin.include_tasks: nvm.yml
  when: customization_nvm | bool

- name: Install rustup and cargo
  ansible.builtin.include_tasks: rustup.yml
  when: customization_rustup | bool

- name: Install Docker and Docker Compose
  ansible.builtin.include_tasks: docker.yml
  when: customization_docker | bool

- name: Install the Claude CLI and ripgrep
  ansible.builtin.include_tasks: claude_cli.yml
  when: customization_claude_cli | bool

- name: Install ansible-core
  ansible.builtin.include_tasks: ansible_core.yml
  when: customization_ansible_core | bool
