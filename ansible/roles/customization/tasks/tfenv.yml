---
# tfenv (Terraform version manager) from a pinned git tag, not a piped script.
# Latest Terraform release installed through it.

- name: Install the tfenv prerequisites
  ansible.builtin.apt:
    name:
      - git       # the tfenv checkout itself
      - curl      # tfenv fetches releases with curl
      - unzip     # release artifacts are zips
      - gnupg     # lets tfenv verify the release signature, not just the sha256
    state: present

- name: Clone tfenv at the pinned tag
  ansible.builtin.git:
    repo: https://github.com/tfutils/tfenv.git
    dest: "/home/{{ code_server_user }}/.tfenv"
    version: "{{ customization_tfenv_version }}"
    depth: 1
  become: true
  become_user: "{{ code_server_user }}"

- name: Put tfenv on PATH for interactive shells
  ansible.builtin.blockinfile:
    path: "/home/{{ code_server_user }}/.bashrc"
    create: true
    owner: "{{ code_server_user }}"
    group: "{{ code_server_user }}"
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED - tfenv"
    block: |
      export PATH="$HOME/.tfenv/bin:$PATH"

# `install latest` is a no-op once that release is present, so re-runs are free.
- name: Install the latest Terraform release
  ansible.builtin.command: "/home/{{ code_server_user }}/.tfenv/bin/tfenv install latest"
  become: true
  become_user: "{{ code_server_user }}"
  register: customization_tfenv_install
  changed_when: "'already installed' not in customization_tfenv_install.stdout"

- name: Select it as the default Terraform version
  ansible.builtin.command: "/home/{{ code_server_user }}/.tfenv/bin/tfenv use latest"
  become: true
  become_user: "{{ code_server_user }}"
  changed_when: false
