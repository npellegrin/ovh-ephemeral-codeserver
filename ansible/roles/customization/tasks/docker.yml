---
# Docker Engine + the Compose v2 plugin from Docker's official signed apt repository
- name: Install prerequisites for the Docker repository
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gnupg
    state: present

- name: Ensure the apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add the Docker apt signing key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add the Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    architectures: amd64
    uris: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}"
    suites: "{{ ansible_facts.distribution_release }}"
    components: stable
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Install Docker Engine and the Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

# Membership grants root-equivalent access through the Docker socket; that is
# the point of a single-user dev box, but it is not a privilege boundary.
- name: Let the dev user reach the Docker socket
  ansible.builtin.user:
    name: "{{ code_server_user }}"
    groups: docker
    append: true

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
