---
- name: Install Nginx and Certbot
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
      - python3-certbot-nginx
    state: present

- name: Remove the default configuration
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Define the login rate-limit zone
  ansible.builtin.copy:
    dest: /etc/nginx/conf.d/code-server-limits.conf
    content: |
      # Shared by the code-server vhost's `location = /login`.
      limit_req_zone $binary_remote_addr zone=cs_login:10m rate=10r/m;
  notify: Restart nginx

- name: Ensure the ACME webroot exists
  ansible.builtin.file:
    path: /var/www/html
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Check whether the Let's Encrypt certificate already exists
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"
  register: nginx_le_cert

- name: Configure the Nginx reverse proxy for code-server
  ansible.builtin.template:
    src: code-server.conf.j2
    dest: /etc/nginx/sites-available/code-server.conf
  vars:
    tls_ready: "{{ nginx_le_cert.stat.exists }}"
  notify: Restart nginx

- name: Enable the site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/code-server.conf
    dest: /etc/nginx/sites-enabled/code-server.conf
    state: link
  notify: Restart nginx

- name: Start Nginx (required for HTTP ACME validation)
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true

# Apply the HTTP vhost before certbot performs the webroot challenge
- name: Reload Nginx before requesting the certificate
  ansible.builtin.meta: flush_handlers

- name: Obtain the Let's Encrypt certificate
  ansible.builtin.command: >
    certbot certonly --webroot
    -w /var/www/html
    -d {{ domain_name }}
    --non-interactive
    --agree-tos
    -m {{ letsencrypt_email }}
  args:
    creates: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"

- name: Render the Nginx config with TLS enabled
  ansible.builtin.template:
    src: code-server.conf.j2
    dest: /etc/nginx/sites-available/code-server.conf
  vars:
    tls_ready: true
  notify: Restart nginx

# certonly records no installer, so `certbot renew` won't reload Nginx on
# its own; this deploy hook runs after every successful renewal.
- name: Ensure the renewal deploy-hook directory exists
  ansible.builtin.file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    mode: "0755"

- name: Install the renewal deploy hook (reload Nginx)
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
    mode: "0755"
    content: |
      #!/bin/sh
      systemctl reload nginx

- name: Enable automatic certificate renewal
  ansible.builtin.systemd:
    name: certbot.timer
    enabled: true
    state: started
