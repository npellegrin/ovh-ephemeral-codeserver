---
- name: Back up data to OVH Object Storage
  hosts: dev_servers
  become: yes
  vars_files:
    - group_vars/vars.yml
    - group_vars/vault.yml

  vars:
    backup_filename: "backup-{{ ansible_date_time.iso8601_basic_short }}.tar.gz"

  tasks:
    - name: Install rclone
      apt:
        name: rclone
        state: present

    - name: Ensure the rclone config directory exists
      file:
        path: /root/.config/rclone
        state: directory
        mode: '0700'

    - name: Create a temp file for the backup archive
      tempfile:
        state: file
        suffix: .tar.gz
      register: backup_archive

    # The rclone config holds the Swift credentials; it is rewritten on
    # every run, so the always block wipes it (and the archive) afterwards.
    - name: Run the backup
      block:
        - name: Estimate the size of the data to back up
          command: >
            du -sbc
            {% for exclude in backup_excludes %}--exclude={{ exclude }} {% endfor %}
            {% for path in backup_paths %}{{ path }} {% endfor %}
          register: backup_du
          changed_when: false

        - name: Measure free space on the archive filesystem
          command: df -B1 --output=avail {{ backup_archive.path | dirname }}
          register: backup_fs
          changed_when: false

        # The archive is at most the uncompressed size of the data, so if
        # that fits we are safe; if it does not, fail rather than half-write.
        - name: Ensure there is enough disk space for the backup archive
          assert:
            that:
              - (backup_fs.stdout_lines[-1] | trim | int) > (backup_du.stdout_lines[-1].split()[0] | int)
            fail_msg: >-
              Not enough free space on {{ backup_archive.path | dirname }}:
              up to {{ backup_du.stdout_lines[-1].split()[0] | int }} bytes needed,
              {{ backup_fs.stdout_lines[-1] | trim | int }} available.
            quiet: true

        - name: Configure rclone for OVH Object Storage (Swift)
          copy:
            dest: /root/.config/rclone/rclone.conf
            content: |
              [ovh]
              type = swift
              env_auth = false
              auth_version = 3
              auth = {{ swift_auth }}
              user = {{ swift_user }}
              key = {{ swift_key }}
              tenant_id = {{ swift_tenant_id }}
              domain = default
              tenant_domain = default
              region = {{ swift_region }}
              endpoint_type = public
            mode: '0600'
          no_log: true

        - name: Create the backup archive
          shell: >
            tar
            {% for exclude in backup_excludes %}--exclude='{{ exclude }}' {% endfor %}
            -czf {{ backup_archive.path }}
            {% for path in backup_paths %}{{ path }} {% endfor %}

        - name: Upload the archive to Object Storage
          command: rclone copyto {{ backup_archive.path }} ovh:{{ backup_bucket }}/{{ backup_filename }}

        - name: Confirm the backup
          debug:
            msg: "Backup completed: {{ backup_filename }} uploaded to {{ backup_bucket }}"
      always:
        - name: Remove the rclone credentials (regenerated every run)
          file:
            path: /root/.config/rclone/rclone.conf
            state: absent

        - name: Remove the local temporary archive
          file:
            path: "{{ backup_archive.path }}"
            state: absent
