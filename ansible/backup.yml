---
- name: Back up data to OVH Object Storage
  hosts: dev_servers
  become: true
  vars_files:
    - group_vars/vars.yml
    - group_vars/vault.yml

  vars:
    backup_filename: "backup-{{ ansible_facts.date_time.iso8601_basic_short }}.tar.gz"
    # rclone reads a whole remote definition from the environment, so the Swift
    # credentials never land in a config file on the instance. Applied only to
    # the tasks that talk to Object Storage.
    rclone_env:
      RCLONE_CONFIG_OVH_TYPE: swift
      RCLONE_CONFIG_OVH_ENV_AUTH: "false"
      RCLONE_CONFIG_OVH_AUTH_VERSION: "3"
      RCLONE_CONFIG_OVH_AUTH: "{{ swift_auth }}"
      RCLONE_CONFIG_OVH_USER: "{{ swift_user }}"
      RCLONE_CONFIG_OVH_KEY: "{{ swift_key }}"
      RCLONE_CONFIG_OVH_TENANT_ID: "{{ swift_tenant_id }}"
      RCLONE_CONFIG_OVH_DOMAIN: default
      RCLONE_CONFIG_OVH_TENANT_DOMAIN: default
      RCLONE_CONFIG_OVH_REGION: "{{ swift_region }}"
      RCLONE_CONFIG_OVH_ENDPOINT_TYPE: public

  tasks:
    - name: Install rclone
      ansible.builtin.apt:
        name: rclone
        state: present

    - name: Create a temp file for the backup archive
      ansible.builtin.tempfile:
        state: file
        suffix: .tar.gz
      register: backup_archive

    # The always block removes the archive whether or not the upload succeeded.
    - name: Run the backup
      block:
        - name: Estimate the size of the data to back up
          ansible.builtin.command: >
            du -sbc
            {% for exclude in backup_excludes %}--exclude={{ exclude }} {% endfor %}
            {% for path in backup_paths %}{{ path }} {% endfor %}
          register: backup_du
          changed_when: false

        - name: Measure free space on the archive filesystem
          ansible.builtin.command: df -B1 --output=avail {{ backup_archive.path | dirname }}
          register: backup_fs
          changed_when: false

        # The archive is at most the uncompressed size of the data, so if
        # that fits we are safe; if it does not, fail rather than half-write.
        - name: Ensure there is enough disk space for the backup archive
          ansible.builtin.assert:
            that:
              - (backup_fs.stdout_lines[-1] | trim | int) > (backup_du.stdout_lines[-1].split()[0] | int)
            fail_msg: >-
              Not enough free space on {{ backup_archive.path | dirname }}:
              up to {{ backup_du.stdout_lines[-1].split()[0] | int }} bytes needed,
              {{ backup_fs.stdout_lines[-1] | trim | int }} available.
            quiet: true

        - name: Create the backup archive
          ansible.builtin.shell: >
            tar
            {% for exclude in backup_excludes %}--exclude='{{ exclude }}' {% endfor %}
            -czf {{ backup_archive.path }}
            {% for path in backup_paths %}{{ path }} {% endfor %}
          changed_when: true

        - name: Upload the archive to Object Storage
          ansible.builtin.command: rclone copyto {{ backup_archive.path }} ovh:{{ backup_bucket }}/{{ backup_filename }}
          environment: "{{ rclone_env }}"
          changed_when: true

        - name: Confirm the backup
          ansible.builtin.debug:
            msg: "Backup completed: {{ backup_filename }} uploaded to {{ backup_bucket }}"
      always:
        - name: Remove the local temporary archive
          ansible.builtin.file:
            path: "{{ backup_archive.path }}"
            state: absent
